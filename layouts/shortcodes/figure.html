{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" -}}
{{- $class := .Get "class" | default "" -}}
<figure{{ with $class }} class="{{ . }}"{{ end }}>
  {{ partial "responsive-img.html" (dict "page" .Page "src" $src "alt" $alt "class" "my-0 rounded-md") }}
  {{- with $caption }}
  <figcaption>{{ . | markdownify }}</figcaption>
  {{- end }}
</figure>
