<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <nav class="site-nav">
        {{ range site.Menus.main }}
          {{ if ne .Identifier "search" }}
            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
          {{ end }}
        {{ end }}
      </nav>
    </div>
    <div class="header-right">
      <button class="theme-btn" aria-label="Toggle theme" type="button">
        <svg class="icon-moon" viewBox="0 0 16 16" fill="currentColor"><path d="M6 1a7 7 0 1 0 8.4 10.8A5.5 5.5 0 0 1 6 1Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>
