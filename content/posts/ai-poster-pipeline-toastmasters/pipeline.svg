<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">海报流水线</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#999">一个输入 → 全自动 → 三版输出</text>

  <!-- ═══ Step 1: Manual — 给 Theme ═══ -->
  <rect x="210" y="72" width="300" height="50" rx="8" fill="#fff8e8" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="360" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b6914">给 Theme</text>
  <text x="360" y="110" text-anchor="middle" font-size="10" fill="#b5922e">唯一的手动输入（+ 会议信息如有变动）</text>
  <rect x="520" y="86" width="48" height="22" rx="11" fill="#d4a72c"/>
  <text x="544" y="101" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Tao</text>

  <!-- Arrow: Step 1 → Step 2 (through divider) -->
  <line x1="360" y1="122" x2="360" y2="160" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- Divider: 以下全自动 -->
  <line x1="140" y1="142" x2="278" y2="142" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="285" y="133" width="150" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="360" y="146" text-anchor="middle" font-size="10" fill="#bbb" letter-spacing="1">以下全自动</text>
  <line x1="442" y1="142" x2="580" y2="142" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══ Step 2: 写背景 Prompt ═══ -->
  <rect x="210" y="162" width="300" height="50" rx="8" fill="#f3eeff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="360" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2d8a">写背景 Prompt</text>
  <text x="360" y="200" text-anchor="middle" font-size="10" fill="#7a60a8">按 theme 定制场景 + 选 fusion 风格</text>
  <rect x="520" y="176" width="48" height="22" rx="11" fill="#7c5cc4"/>
  <text x="544" y="191" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LLM</text>

  <!-- Arrow: Step 2 → Step 3 -->
  <line x1="360" y1="212" x2="360" y2="230" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ═══ Step 3: 生成像素背景图 ═══ -->
  <rect x="210" y="232" width="300" height="50" rx="8" fill="#eaf5f2" stroke="#3a9a88" stroke-width="1.5"/>
  <text x="360" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a6b5a">生成像素背景图</text>
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="#4a8a7e">gpt-image-2 · Codex CLI</text>
  <rect x="518" y="246" width="56" height="22" rx="11" fill="#3a9a88"/>
  <text x="546" y="261" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Codex</text>

  <!-- Arrow: Step 3 → Step 4 -->
  <line x1="360" y1="282" x2="360" y2="300" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ═══ Step 4: 构建 + 审视 HTML ═══ -->
  <rect x="210" y="302" width="300" height="50" rx="8" fill="#f3eeff" stroke="#7c5cc4" stroke-width="1.5"/>
  <text x="360" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2d8a">构建 + 审视 HTML</text>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#7a60a8">模板 · logo · 二维码 · 信息 · 彩蛋</text>
  <rect x="520" y="316" width="48" height="22" rx="11" fill="#7c5cc4"/>
  <text x="544" y="331" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">LLM</text>

  <!-- Arrow: Step 4 → Step 5 -->
  <line x1="360" y1="352" x2="360" y2="370" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ═══ Step 5: 渲染 PNG ═══ -->
  <rect x="210" y="372" width="300" height="50" rx="8" fill="#eaf5f2" stroke="#3a9a88" stroke-width="1.5"/>
  <text x="360" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a6b5a">渲染 PNG</text>
  <text x="360" y="410" text-anchor="middle" font-size="10" fill="#4a8a7e">Chrome headless · render-poster.sh</text>
  <rect x="520" y="386" width="48" height="22" rx="11" fill="#3a9a88"/>
  <text x="544" y="401" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">脚本</text>

  <!-- Branch arrows: Step 5 → 3 outputs -->
  <line x1="360" y1="422" x2="175" y2="454" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="422" x2="360" y2="454" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="422" x2="545" y2="454" stroke="#aaa" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ═══ Output 1: 微信群版 ═══ -->
  <rect x="100" y="456" width="150" height="48" rx="6" fill="#f0f4f8" stroke="#7a9bb5" stroke-width="1.2"/>
  <text x="175" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6a80">微信群版</text>
  <text x="175" y="492" text-anchor="middle" font-size="9" fill="#8aa0b4">带二维码 · 9:16</text>

  <!-- ═══ Output 2: 小红书版 ═══ -->
  <rect x="285" y="456" width="150" height="48" rx="6" fill="#f0f4f8" stroke="#7a9bb5" stroke-width="1.2"/>
  <text x="360" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6a80">小红书版</text>
  <text x="360" y="492" text-anchor="middle" font-size="9" fill="#8aa0b4">CTA 瓷片 · 9:16</text>

  <!-- ═══ Output 3: 取伙版 ═══ -->
  <rect x="470" y="456" width="150" height="48" rx="6" fill="#f0f4f8" stroke="#7a9bb5" stroke-width="1.2"/>
  <text x="545" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a6a80">取伙版</text>
  <text x="545" y="492" text-anchor="middle" font-size="9" fill="#8aa0b4">带二维码 · 3:4</text>
</svg>
