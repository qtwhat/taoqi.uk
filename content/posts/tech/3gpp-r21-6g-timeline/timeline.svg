  <!-- RAN#115 highlight column -->
  <rect x="376" y="65" width="61" height="405" fill="#6c49b6" opacity="0.06" rx="2"/>

  <!-- === Track 1: R20 6G Studies (y=85..155) === -->
  <text x="12" y="95" class="track-label">R20 6G</text>
  <text x="12" y="108" class="track-label">Studies</text>

  <rect x="130" y="84" width="30" height="14" fill="#8a8985" opacity="0.3" rx="3"/>
  <text x="145" y="94" font-size="8" fill="#8a8985" text-anchor="middle">SA1</text>

  <rect x="130" y="102" width="276" height="14" fill="#2a78d6" opacity="0.25" rx="3"/>
  <text x="268" y="112" font-size="9" fill="#2a78d6" text-anchor="middle">RAN1 6G Study</text>

  <rect x="130" y="120" width="338" height="14" fill="#008300" opacity="0.25" rx="3"/>
  <text x="299" y="130" font-size="9" fill="#008300" text-anchor="middle">RAN2/3/4 6G Study</text>

  <rect x="130" y="138" width="276" height="14" fill="#eda100" opacity="0.25" rx="3"/>
  <text x="268" y="148" font-size="9" fill="#9a6800" text-anchor="middle">SA2 Architecture Study</text>

  <!-- R20 Stage-3 freeze marker at #115 -->
  <polygon points="406,142 410,149 402,149" fill="#8a8985"/>
  <text x="402" y="148" font-size="8" fill="#8a8985" text-anchor="end">R20 Stage-3 freeze </text>

  <!-- === Track 2: R21 Milestones (y=195, labels alternate above/below) === -->
  <text x="12" y="195" class="track-label">R21</text>
  <text x="12" y="208" class="track-label">Milestones</text>

  <!-- Milestone line -->
  <line x1="406" y1="200" x2="898" y2="200" stroke="#6c49b6" stroke-width="2" opacity="0.3"/>

  <!-- 1. Stage-1 freeze + Package Approval: Mar 2027 (#115) — ABOVE -->
  <polygon points="406,190 416,200 406,210 396,200" fill="#6c49b6"/>
  <line x1="406" y1="190" x2="406" y2="176" stroke="#6c49b6" stroke-width="1" opacity="0.4"/>
  <text x="406" y="173" class="ms-above" text-anchor="middle" fill="#6c49b6">Stage-1 freeze</text>
  <text x="406" y="163" font-size="9" fill="#6c49b6" text-anchor="middle">+ Package Approval</text>

  <!-- 2. Stage-2 checkpoint 80%: Mar 2028 (#119) — BELOW -->
  <circle cx="652" cy="200" r="5" fill="none" stroke="#6c49b6" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="652" y1="210" x2="652" y2="222" stroke="#6c49b6" stroke-width="1" opacity="0.4"/>
  <text x="652" y="234" class="ms-below" text-anchor="middle">checkpoint 80%</text>
  <text x="652" y="245" class="note" text-anchor="middle">(not a freeze)</text>

  <!-- 3. Stage-2 freeze 100%: Jun 2028 (#120) — ABOVE -->
  <polygon points="714,190 724,200 714,210 704,200" fill="#6c49b6"/>
  <line x1="714" y1="190" x2="714" y2="176" stroke="#6c49b6" stroke-width="1" opacity="0.4"/>
  <text x="714" y="173" class="ms-above" text-anchor="middle" fill="#6c49b6">Stage-2 freeze</text>

  <!-- 4. Stage-3 freeze: Dec 2028 (#122) — BELOW -->
  <polygon points="837,190 847,200 837,210 827,200" fill="#6c49b6"/>
  <line x1="837" y1="210" x2="837" y2="222" stroke="#6c49b6" stroke-width="1" opacity="0.4"/>
  <text x="837" y="234" class="ms-below" text-anchor="middle" fill="#6c49b6">Stage-3 freeze</text>

  <!-- 5. ASN.1 freeze: Mar 2029 (#123) — ABOVE -->
  <polygon points="898,190 908,200 898,210 888,200" fill="#e04040"/>
  <line x1="898" y1="190" x2="898" y2="176" stroke="#e04040" stroke-width="1" opacity="0.4"/>
  <text x="898" y="173" class="ms-above" text-anchor="middle" fill="#e04040">ASN.1 freeze</text>

  <!-- === Track 3: RAN1 (y=280) === -->
  <text x="12" y="284" class="track-label">RAN1</text>

  <rect x="468" y="274" width="307" height="22" fill="#2a78d6" rx="4"/>
  <text x="621" y="289" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">RAN1 normative work</text>
  <text x="468" y="308" font-size="9" fill="#2a78d6">Q2/2027</text>
  <text x="775" y="308" font-size="9" fill="#2a78d6" text-anchor="end">Q3/2028</text>

  <!-- === Track 4: RAN2/3/4 (y=330) === -->
  <text x="12" y="338" class="track-label">RAN2/3/4</text>

  <rect x="529" y="328" width="308" height="22" fill="#008300" rx="4"/>
  <text x="683" y="343" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">RAN2/3/4 normative work</text>
  <text x="529" y="362" font-size="9" fill="#008300">Q3/2027</text>
  <text x="837" y="362" font-size="9" fill="#008300" text-anchor="end">Q4/2028</text>

  <!-- 1Q offset annotation: horizontal bracket between RAN1 start and RAN2/3/4 start -->
  <line x1="468" y1="270" x2="468" y2="265" stroke="#8a8985" stroke-width="1"/>
  <line x1="468" y1="265" x2="529" y2="265" stroke="#8a8985" stroke-width="1"/>
  <line x1="529" y1="270" x2="529" y2="265" stroke="#8a8985" stroke-width="1"/>
  <text x="498" y="262" font-size="9" fill="#8a8985" text-anchor="middle">1Q offset</text>

  <!-- === Track 5: RAN4 spectrum (y=385) === -->
  <text x="12" y="390" class="track-label">RAN4</text>
  <text x="12" y="403" class="label">spectrum</text>

  <polygon points="529,390 539,400 529,410 519,400" fill="#eb6834"/>
  <text x="545" y="404" font-size="9" fill="#eb6834">spectrum items approved</text>

  <!-- === Track 6: ITU-R deadline (y=440) === -->
  <text x="12" y="445" class="track-label">ITU-R</text>
  <text x="12" y="458" class="label">WP5D</text>

  <rect x="390" y="435" width="490" height="16" fill="#e04040" opacity="0.08" rx="3"/>
  <line x1="880" y1="430" x2="880" y2="458" stroke="#e04040" stroke-width="2"/>
  <text x="875" y="468" font-size="9" fill="#e04040" text-anchor="end">Feb 2029 deadline</text>
  <text x="395" y="447" font-size="9" fill="#e04040">IMT-2030 submission window</text>

  <!-- === Annotations === -->

  <!-- TSG#112 agreed label -->
  <line x1="222" y1="65" x2="222" y2="160" stroke="#6c49b6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="172" y="152" width="100" height="16" fill="#6c49b6" rx="8"/>
  <text x="222" y="163" font-size="9" fill="#fff" text-anchor="middle">RP-260868 agreed</text>

  <!-- RAN#115 label -->
  <rect x="371" y="66" width="70" height="14" fill="#6c49b6" rx="7"/>
  <text x="406" y="76" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">RAN#115</text>
