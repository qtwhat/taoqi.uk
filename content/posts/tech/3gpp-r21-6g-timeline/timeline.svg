<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .label { font-size: 11px; fill: #52514e; }
    .track-label { font-size: 12px; fill: #0b0b0b; font-weight: 600; }
    .year { font-size: 13px; fill: #0b0b0b; font-weight: 700; }
    .tsg { font-size: 9px; fill: #8a8985; }
    .quarter { font-size: 10px; fill: #8a8985; }
    .ms-above { font-size: 10px; fill: #0b0b0b; font-weight: 600; }
    .ms-below { font-size: 10px; fill: #0b0b0b; font-weight: 600; }
    .note { font-size: 9px; fill: #8a8985; font-style: italic; }
    .grid { stroke: #e8e8e5; stroke-width: 0.5; }
    .grid-major { stroke: #d0d0cb; stroke-width: 1; }
  </style>

  <rect width="960" height="500" fill="#fcfcfb" rx="4"/>

  <!-- chart area: x=130..930, 13 quarters, each ≈ 61.5px -->

