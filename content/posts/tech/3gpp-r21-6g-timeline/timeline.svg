  <text x="529" y="45" class="quarter" text-anchor="middle">Q3</text>
  <text x="591" y="45" class="quarter" text-anchor="middle">Q4</text>
  <text x="652" y="45" class="quarter" text-anchor="middle">Q1</text>
  <text x="714" y="45" class="quarter" text-anchor="middle">Q2</text>
  <text x="775" y="45" class="quarter" text-anchor="middle">Q3</text>
  <text x="837" y="45" class="quarter" text-anchor="middle">Q4</text>
  <text x="898" y="45" class="quarter" text-anchor="middle">Q1</text>

  <!-- TSG numbers -->
  <text x="160" y="58" class="tsg" text-anchor="middle">#111</text>
  <text x="222" y="58" class="tsg" text-anchor="middle">#112</text>
  <text x="283" y="58" class="tsg" text-anchor="middle">#113</text>
  <text x="345" y="58" class="tsg" text-anchor="middle">#114</text>
  <text x="406" y="58" class="tsg" text-anchor="middle">#115</text>
  <text x="468" y="58" class="tsg" text-anchor="middle">#116</text>
  <text x="529" y="58" class="tsg" text-anchor="middle">#117</text>
