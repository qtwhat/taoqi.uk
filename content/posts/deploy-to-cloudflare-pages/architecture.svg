<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#fafafa"/>

  <!-- Local section -->
  <rect x="30" y="30" width="260" height="460" rx="10" fill="#f0f4ff" stroke="#b0c4ff" stroke-width="1.5"/>
  <text x="160" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#334">本地电脑</text>

  <!-- Markdown file -->
  <rect x="60" y="90" width="200" height="56" rx="8" fill="#fff" stroke="#7cacf8" stroke-width="1.5"/>
  <text x="160" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#335">Markdown 文件</text>
  <text x="160" y="133" text-anchor="middle" font-size="11" fill="#668">blog/tech/…/index.md</text>

  <!-- Hugo -->
  <rect x="60" y="176" width="200" height="56" rx="8" fill="#fff" stroke="#7cacf8" stroke-width="1.5"/>
  <text x="160" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#335">Hugo（静态站生成器）</text>
  <text x="160" y="219" text-anchor="middle" font-size="11" fill="#668">.md → .html + CSS + JS</text>

  <!-- Git -->
  <rect x="60" y="262" width="200" height="56" rx="8" fill="#fff" stroke="#7cacf8" stroke-width="1.5"/>
  <text x="160" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#335">Git（版本管理）</text>
  <text x="160" y="305" text-anchor="middle" font-size="11" fill="#668">跟踪每次修改</text>

  <!-- llm-wiki -->
  <rect x="60" y="358" width="200" height="100" rx="8" fill="#eef6ee" stroke="#8bc48b" stroke-width="1.5"/>
  <text x="160" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#335">llm-wiki 项目</text>
  <text x="160" y="402" text-anchor="middle" font-size="11" fill="#668">blog/ ← 博客主副本</text>
  <text x="160" y="419" text-anchor="middle" font-size="11" fill="#668">wiki/ ← 知识库</text>
  <text x="160" y="436" text-anchor="middle" font-size="11" fill="#668">raw/  ← 原始素材</text>

  <!-- Arrows: local vertical -->
  <line x1="160" y1="146" x2="160" y2="176" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="232" x2="160" y2="262" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Copy arrow from llm-wiki to Markdown -->
  <path d="M 200 358 C 200 340, 200 340, 200 146" stroke="#8bc48b" stroke-width="1.2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
  <text x="224" y="250" font-size="10" fill="#5a8a5a" transform="rotate(-90, 224, 250)">复制到 taoqi.uk</text>

  <!-- GitHub section -->
  <rect x="340" y="30" width="220" height="460" rx="10" fill="#fff8f0" stroke="#f0c878" stroke-width="1.5"/>
  <text x="450" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#334">GitHub</text>

  <!-- GitHub repo -->
  <rect x="365" y="262" width="170" height="70" rx="8" fill="#fff" stroke="#e8b44c" stroke-width="1.5"/>
  <text x="450" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#335">qtwhat/taoqi.uk</text>
  <text x="450" y="307" text-anchor="middle" font-size="11" fill="#668">源代码仓库</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#668">（公开）</text>

  <!-- Arrow: Git to GitHub -->
  <line x1="260" y1="290" x2="365" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="282" text-anchor="middle" font-size="11" fill="#666">git push</text>

  <!-- Webhook arrow -->
  <line x1="535" y1="290" x2="620" y2="290" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="282" text-anchor="middle" font-size="11" fill="#666">Webhook</text>

  <!-- Cloudflare section -->
  <rect x="610" y="30" width="260" height="460" rx="10" fill="#fff5f0" stroke="#f4a460" stroke-width="1.5"/>
  <text x="740" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#334">Cloudflare</text>

  <!-- CF Pages Build -->
  <rect x="635" y="230" width="210" height="56" rx="8" fill="#fff" stroke="#f4a460" stroke-width="1.5"/>
  <text x="740" y="254" text-anchor="middle" font-size="13" font-weight="600" fill="#335">Pages 构建</text>
  <text x="740" y="273" text-anchor="middle" font-size="11" fill="#668">hugo --minify</text>

  <!-- CF CDN -->
  <rect x="635" y="316" width="210" height="56" rx="8" fill="#fff" stroke="#f4a460" stroke-width="1.5"/>
  <text x="740" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#335">全球 CDN</text>
  <text x="740" y="359" text-anchor="middle" font-size="11" fill="#668">310+ 节点自动分发</text>

  <!-- CF DNS -->
  <rect x="635" y="402" width="210" height="56" rx="8" fill="#fff" stroke="#f4a460" stroke-width="1.5"/>
  <text x="740" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#335">DNS + SSL</text>
  <text x="740" y="445" text-anchor="middle" font-size="11" fill="#668">taoqi.uk → HTTPS 自动</text>

  <!-- CF vertical arrows -->
  <line x1="740" y1="286" x2="740" y2="316" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="372" x2="740" y2="402" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Visitor -->
  <rect x="635" y="100" width="210" height="56" rx="8" fill="#fff0e8" stroke="#f4a460" stroke-width="1.5"/>
  <text x="740" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#335">访客浏览器</text>
  <text x="740" y="143" text-anchor="middle" font-size="11" fill="#668">https://taoqi.uk</text>

  <!-- Arrow: CDN to visitor -->
  <line x1="740" y1="230" x2="740" y2="156" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cost labels -->
  <text x="160" y="488" text-anchor="middle" font-size="11" font-weight="600" fill="#668">免费</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" font-weight="600" fill="#668">免费</text>
  <text x="740" y="488" text-anchor="middle" font-size="11" font-weight="600" fill="#668">域名 $5.30/年，其余免费</text>
</svg>
