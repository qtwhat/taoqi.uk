# Blowfish theme parameters
# Documentation: https://blowfish.page/docs/configuration/

# Color scheme: noir gives a clean Ghost-like aesthetic
colorScheme = "noir"
defaultAppearance = "light"  # light / dark
autoSwitchAppearance = true  # auto switch based on OS preference

# Global
enableSearch = true
enableCodeCopy = true

# Header
[header]
  layout = "basic"  # basic, fixed, fixed-fill, fixed-fill-blur

# Footer
[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# Homepage
[homepage]
  layout = "hero"  # page, profile, hero, card, background, custom
  homepageImage = ""  # can set a hero background image later
  showRecent = true
  showRecentItems = 9
  showMoreLink = true
  showMoreLinkDest = "/posts"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = true

# Article
[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = true
  showAuthor = true
  showHero = true
  heroStyle = "big"  # basic, big, background, thumbAndBackground
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = false
  sharingLinks = ["x-twitter", "telegram", "weibo", "email", "link"]
  showComments = true

# List
[list]
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = true
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = true
  orderByWeight = false
  groupByYear = true

# Sitemap
[sitemap]
  excludedKinds = []

# Taxonomy
[taxonomy]
  showTermCount = true
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

# Term
[term]
  showHero = false
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false
