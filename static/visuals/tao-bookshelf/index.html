<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tao 的书架</title><link rel="stylesheet" href="style.css"><body>
<header><button id="menu" title="书刊列表" aria-label="书刊列表">☷</button><h1>Tao 的书架</h1><nav><button id="searchToggle" title="搜索">⌕ <span>搜索</span></button><button id="sortName">A↧ <span>书名</span></button><button id="sortDefault">▦ <span>默认</span></button><button id="fullscreen" title="全屏">⛶</button></nav></header>
<div id="searchbar" hidden><input id="search" placeholder="搜索书名、规范编号…" aria-label="搜索书籍"><button id="clear">清除</button></div>
<main id="shelves" aria-label="木纹书架"></main><aside id="drawer" hidden><h2>书刊列表</h2><div id="list"></div></aside>
<footer><b>TAO<span> / 书架</span></b><div id="count"></div><span>本地藏书</span></footer>
